
{% extends "base.html" %}

{% block content %}

<h3 class="mb-4">درخواست‌های من</h3>

{% for a in applications %}

<div class="card mb-3 shadow-sm border-0">
    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">

            <div>
                <h5 class="mb-1">{{ a.job.title }}</h5>
                <span class="text-muted">{{ a.job.company_name }}</span>
            </div>

            <span class="badge {{ a.get_status_badge_class }} fs-6">
                {{ a.get_status_display }}
            </span>

        </div>

        <div class="small text-muted">
            تاریخ ارسال درخواست: {{ a.created_at }}
        </div>

    </div>
</div>

{% empty %}

<div class="alert alert-light border text-center">
    درخواستی ثبت نکرده‌اید.
</div>

{% endfor %}

{% endblock %}
