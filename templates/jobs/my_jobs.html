
{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">آگهی‌های من</h3>
    <a class="btn btn-primary" href="{% url 'jobs:create' %}">
        <i class="bi bi-plus-circle"></i>
        ثبت آگهی جدید
    </a>
</div>

{% for job in jobs %}
<div class="card mb-3 shadow-sm border-0">
    <div class="card-body">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">

            <div>
                <h5 class="mb-2">{{ job.title }}</h5>
                <span class="text-muted">
                    <i class="bi bi-geo-alt"></i>
                    {{ job.city }}
                </span>
            </div>

            <div class="d-flex flex-wrap gap-2">

                <a href="{% url 'jobs:detail' job.pk %}"
                   class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-eye"></i>
                    مشاهده
                </a>

                <a href="{% url 'jobs:edit' job.pk %}"
                   class="btn btn-sm btn-outline-warning">
                    <i class="bi bi-pencil-square"></i>
                    ویرایش
                </a>

                <a href="{% url 'jobs:delete' job.pk %}"
                   class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i>
                    حذف
                </a>

                <a href="{% url 'applications:employer_applications' %}?job={{ job.pk }}"
                   class="btn btn-sm btn-success">
                    <i class="bi bi-people"></i>
                    درخواست‌ها
                </a>

            </div>

        </div>

    </div>
</div>

{% empty %}

<div class="alert alert-light text-center border">
    هنوز آگهی ثبت نکرده‌اید.
</div>

{% endfor %}

{% endblock %}
