{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}کاریاب{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
 <div class="container"><a class="navbar-brand" href="{% url 'core:home' %}">کاریاب</a>
 <div class="d-flex gap-2 align-items-center">
  <a class="btn btn-sm btn-outline-light" href="{% url 'jobs:list' %}">فرصت‌های شغلی</a>
  {% if user.is_authenticated %}
   <a class="btn btn-sm btn-light" href="{% url 'accounts:profile' %}">پروفایل</a>
   <a class="btn btn-sm btn-outline-light" href="{% url 'jobs:my_jobs' %}">آگهی‌های من</a>
   <a class="btn btn-sm btn-outline-light" href="{% url 'applications:my_applications' %}">درخواست‌های من</a>
   <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="btn btn-sm btn-warning">خروج</button></form>
  {% else %}<a class="btn btn-sm btn-light" href="{% url 'accounts:request_otp' %}">ورود / ثبت‌نام</a>{% endif %}
 </div></div>
</nav>
<main class="container py-4">
 {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
 {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
